# jm_plugin - 自动生成的配置文件

[plugin]

# 配置文件版本号
config_version = "1.0.0"

# 是否启用插件
enabled = true

[jm]

# JM 漫画下载目录，为空则使用 data/plugins/yumemi1.jm_plugin/
jm_data_dir = ""

# 主人qq: 控制能否下载图片（为空则所有人都可以下载）
owner_qq = ""  # 留空则不限制

# 机器人框架类型：snowluma 或 napcat
framework = "snowluma"

# 机器人框架 HTTP API 基础 URL
api_base_url = "http://127.0.0.1:3000"

# API 鉴权 Token（留空则不发送）
api_token = ""

# Token 传递方式：header=Authorization: Bearer（两框架均支持）；query=URL 参数 access_token（SnowLuma 支持）
auth_mode = "header"

# 启用 WSL 路径转换（框架运行在 WSL 中时需设为 true）
enable_wsl_path = false

# PDF 最大页数限制
max_pdf_pages = 300

# 将压缩包伪装成指定格式
use_encrypted_zip = true
fake_extension = ".dat"   # 可以改成 .bin, .tmp 等

[sotu]

# SauceNAO API Key
api_key = "你的key填在这里"
# 代理（可选）
proxy = ""    #替换为你实际的代理端口例如http://127.0.0.1:7890
